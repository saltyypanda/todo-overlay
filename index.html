<!doctype html>
<html>
  <head>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="window">
      <h2 class="text-2xl font-bold pb-4">Today's Tasks</h2>

      <div class="flex gap-2 mb-4">
        <input
          id="task-input"
          type="text"
          placeholder="New task..."
          class="input input-bordered input-sm flex-1 no-drag"
        />

        <button id="add-task" class="btn btn-primary btn-sm no-drag">
          Add
        </button>
      </div>

      <ul id="task-list"></ul>

      <ul id="task-list" contenteditable="true"></ul>
      <script src="tasks.js"></script>
    </div>
  </body>
</html>
